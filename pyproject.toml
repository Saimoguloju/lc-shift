[project]
name = "lc-shift"
version = "0.4.0"
description = "Provider-agnostic LLM router for the agentic era — drop-in OpenAI-compatible proxy, native MCP server, and agent-loop escalation routing. Routes each prompt to the optimal model tier via complexity, kNN, classifier, semantic, ensemble, role, budget, or latency. Sub-1ms, zero dependencies, built-in cost-quality benchmarking, CLI, 35 providers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Moguloju Sai", email = "sai.moguloju@elisiontec.com" }]
keywords = [
    "llm", "router", "routing", "ai", "openai", "anthropic", "gemini",
    "llm-router", "llm-gateway", "model-routing", "cost-optimization",
    "fallback", "multi-provider", "orchestration",
    "mcp", "model-context-protocol", "agents", "agentic", "ai-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = ["pydantic>=2.0,<3.0"]

[project.scripts]
lc-shift = "lc_shift.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "mypy>=1.10",
    "streamlit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lc_shift"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 99
